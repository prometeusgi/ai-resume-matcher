version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    image: ai-service:0.1.0
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  matcher-service:
    image: matcher-service:0.0.1-SNAPSHOT
    restart: on-failure
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/matcher_db
      AI_SERVICE_BASE_URL: http://ai-service:8000
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo-data:
